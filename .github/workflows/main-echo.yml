name: Build Echo Docker image and scan with Grype

on:
  workflow_dispatch
    
jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Check out the repo
      uses: actions/checkout@v4

    - name: Login to Echo 
      uses: SeptBlast/docker-login@v1.0.1, action/core
      with:
        login-server: 'reg.echohq.com' # default: index.docker.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build image
      uses: docker/build-push-action@v5
      with:
       context:
       file: dockerfile-echo
       tags: uvicorn/uvicorn-echo:latest

    - name: Scan the Docker image 
      uses: anchore/scan-action@v3
      with:
        image: uvicorn/uvicorn-echo:latest
